    // --- Radar Chart Component ---
    const RadarChart = ({ data, size = 300 }) => {
      const center = size / 2;
      const radius = (size / 2) - 60; // Adjusted padding for labels
      const angleStep = (Math.PI * 2) / data.labels.length;

      const getCoordinates = (value, index, max = 5) => {
        const adjustedAngle = index * angleStep - Math.PI / 2;
        return [
          center + (value / max) * radius * Math.cos(adjustedAngle),
          center + (value / max) * radius * Math.sin(adjustedAngle)
        ];
      };

      // Generate polygon points string
      const getPoints = (dataset) => {
        return dataset.data.map((val, i) => getCoordinates(val, i).join(',')).join(' ');
      };

      // Grid lines
      const levels = [1, 2, 3, 4, 5];

      return (
        <div className="relative flex justify-center items-center">
          <svg width={size} height={size} className="overflow-visible">
            {/* Background Grid */}
            {levels.map(level => (
              <polygon
                key={level}
                points={data.labels.map((_, i) => getCoordinates(level, i).join(',')).join(' ')}
                fill="none"
                stroke="#E5E7EB"
                strokeWidth="1"
                strokeDasharray={level === 5 ? "0" : "4 4"}
              />
            ))}

            {/* Axis Lines */}
            {data.labels.map((_, i) => {
              const [x, y] = getCoordinates(5, i);
              return (
                <line key={i} x1={center} y1={center} x2={x} y2={y} stroke="#E5E7EB" strokeWidth="1" />
              );
            })}

            {/* Data Polygons */}
            {data.datasets.map((dataset, i) => (
              <g key={i}>
                <polygon
                  points={getPoints(dataset)}
                  fill="none"
                  stroke={dataset.stroke}
                  strokeWidth="3"
                  className="transition-all duration-1000 ease-out"
                />
                {/* Data Points */}
                {dataset.data.map((val, j) => {
                  const [x, y] = getCoordinates(val, j);
                  return (
                    <circle key={j} cx={x} cy={y} r="4" fill={dataset.stroke} className="hover:r-6 transition-all" />
                  );
                })}
              </g>
            ))}

            {/* Labels */}
            {data.labels.map((label, i) => {
              const [x, y] = getCoordinates(6, i);

              // Dynamic Text Anchor to prevent overlap
              const angle = i * angleStep - Math.PI / 2;
              const cos = Math.cos(angle);
              let anchor = "middle";
              if (cos > 0.01) anchor = "start";
              if (cos < -0.01) anchor = "end";

              return (
                <text
                  key={i}
                  x={x}
                  y={y}
                  textAnchor={anchor}
                  dominantBaseline="middle"
                  className="text-[10px] md:text-xs font-bold fill-gray-600 uppercase tracking-wider"
                >
                  {label}
                </text>
              );
            })}
          </svg>
        </div>
      );
    };

          <div className="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 flex flex-col gap-6">
            <div>
              <h2 className="text-3xl font-black text-gray-900 mb-2">{data.name}</h2>
              <p className="text-gray-500 w-full leading-relaxed">{data.description}</p>
            </div>

            {/* Member Selector */}
            <div className="flex flex-wrap bg-gray-100 p-1 rounded-xl w-full">
              <button
                onClick={() => setSelectedMemberId(null)}
                className={`px-4 py-2 rounded-lg text-sm font-bold transition-all flex-1 justify-center flex ${!selectedMemberId ? 'bg-white text-purple-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'
                  }`}
              >
                Team Overview
              </button>
              {data.members.map(m => (
                <button
                  key={m.id}
                  onClick={() => setSelectedMemberId(m.id)}
                  className={`px-4 py-2 rounded-lg text-sm font-bold transition-all flex items-center gap-2 flex-1 justify-center ${selectedMemberId === m.id ? 'bg-white text-purple-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'
                    }`}
                >
                  {m.name}
                </button>
              ))}
            </div>
          </div>

          <div className="space-y-8">
            {/* Radar Chart Card */}
            <div className="bg-white rounded-[2.5rem] p-8 shadow-lg shadow-purple-900/5 border border-purple-50 flex flex-col items-center justify-center relative overflow-hidden min-h-[500px]">

              {/* View Toggles (Only for Student View) */}
              {selectedMember && (
                <div className="flex justify-center gap-4 mb-8">
                  <button
                    onClick={() => setActiveTab('comparison')}
                    className={`px-6 py-2 rounded-full text-sm font-medium transition-all duration-300 ${activeTab === 'comparison'
                      ? 'bg-purple-600 text-white shadow-lg shadow-purple-500/25 scale-105'
                      : 'bg-gray-800 text-gray-400 hover:bg-gray-700'
                      }`}
                  >
                    Overall vs Self Assessment
                  </button>
                  <button
                    onClick={() => setActiveTab('overall')}
                    className={`px-6 py-2 rounded-full text-sm font-medium transition-all duration-300 ${activeTab === 'overall'
                      ? 'bg-purple-600 text-white shadow-lg shadow-purple-500/25 scale-105'
                      : 'bg-gray-800 text-gray-400 hover:bg-gray-700'
                      }`}
                  >
                    Overall Assessment
                  </button>
                  <button
                    onClick={() => setActiveTab('self')}
                    className={`px-6 py-2 rounded-full text-sm font-medium transition-all duration-300 ${activeTab === 'self'
                      ? 'bg-purple-600 text-white shadow-lg shadow-purple-500/25 scale-105'
                      : 'bg-gray-800 text-gray-400 hover:bg-gray-700'
                      }`}
                  >
                    Student Self Assessment
                  </button>
                </div>
              )}

              {/* Chart Toggles (Visible for Team and Student views, but not comparison) */}
              {activeTab !== 'comparison' && (
                <div className="absolute top-12 left-8 bg-gray-50/90 backdrop-blur-sm p-4 rounded-2xl border border-gray-100 flex flex-col gap-3 z-10 shadow-sm">
                  {["Start of Program", "Middle of Program", "End of Program"].map(label => (
                    <button
                      key={label}
                      onClick={() => toggleDataset(label)}
                      className={`px-5 py-3 rounded-xl text-sm font-bold transition-all flex items-center gap-3 w-full text-left ${visibleDatasets[label.toLowerCase().replace(/ of program/g, '').replace(/ /g, '')]
                        ? 'bg-white text-gray-800 shadow-sm'
                        : 'text-gray-400 hover:text-gray-600 hover:bg-gray-100'
                        }`}
                    >
                      <div
                        className={`w-3 h-3 rounded-full shrink-0 ${visibleDatasets[label.toLowerCase().replace(/ of program/g, '').replace(/ /g, '')] ? '' : 'grayscale opacity-50'}`}
                        style={{ backgroundColor: (selectedMember ? (activeTab === 'self' ? selectedMember.data.self : selectedMember.data.overall) : data.teamOverview).datasets.find(d => d.label === label)?.stroke || '#ccc' }}
                      ></div>
                      {label}
                    </button>
                  ))}
                </div>
              )}

              <h3 className="text-2xl font-black text-gray-900 mb-12 text-center">
                {selectedMember ? (activeTab === 'comparison' ? `${selectedMember.name}'s Comparison` : `${selectedMember.name}'s Growth`) : "Team Aggregate View"}
              </h3>

              {selectedMember && activeTab === 'comparison' ? (
                <ComparisonView member={selectedMember} />
              ) : (
                chartData && <RadarChart data={chartData} size={500} />
              )}
            </div>

            {/* Score Table - Visible for Team and Student single views */}
            {activeTab !== 'comparison' && (
              <div className="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 overflow-x-auto">
                <table className="w-full min-w-[600px]">
                  <thead>
                    <tr className="border-b border-gray-100">
                      <th className="text-left py-4 font-bold text-gray-900">Skill Category</th>
                      <th className="text-center py-4 font-bold text-gray-900">Start of Program</th>
                      <th className="text-center py-4 font-bold text-gray-900">Middle of Program</th>
                      <th className="text-center py-4 font-bold text-gray-900">End of Program</th>
                      <th className="text-center py-4 font-bold text-gray-900 border-l border-purple-100 bg-purple-50/30">Total Growth</th>
                    </tr>
                  </thead>
                  <tbody>
                    {chartData.labels.map((label, i) => {
                      const start = chartData.datasets.find(d => d.label === "Start of Program")?.data[i] || 0;
                      const mid = chartData.datasets.find(d => d.label === "Middle of Program")?.data[i] || 0;
                      const end = chartData.datasets.find(d => d.label === "End of Program")?.data[i] || 0;

                      const midDiff = mid - start;
                      const endDiff = end - mid;
                      const totalGrowth = end - start;

                      const formatDiff = (val) => val > 0 ? `(+${val.toFixed(2)})` : `(${val.toFixed(2)})`;
                      const formatScore = (val) => val.toFixed(2);

                      return (
                        <tr key={label} className="border-b border-gray-50 last:border-0 hover:bg-gray-50/50 transition-colors">
                          <td className="py-4 font-medium text-gray-700">{label}</td>
                          <td className="text-center py-4 text-gray-600">{formatScore(start)}</td>
                          <td className="text-center py-4 text-gray-600">
                            {formatScore(mid)} <span className="text-green-600 text-xs font-bold ml-1">{midDiff !== 0 && formatDiff(midDiff)}</span>
                          </td>
                          <td className="text-center py-4 text-gray-600">
                            {formatScore(end)} <span className="text-green-600 text-xs font-bold ml-1">{endDiff !== 0 && formatDiff(endDiff)}</span>
                          </td>
                          <td className="text-center py-4 font-black text-green-600 border-l border-purple-100 bg-purple-50/30">
                            {totalGrowth > 0 ? '+' : ''}{formatScore(totalGrowth)}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}

            {/* Stats / Insights Grid */}
            {activeTab !== 'comparison' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm">
                  <h3 className="font-bold text-gray-900 mb-4 flex items-center gap-2">
                    <Target className="w-5 h-5 text-purple-600" />
                    {selectedMember ? "Key Strengths" : "Key Strengths"}
                  </h3>
                  <div className="space-y-4">
                    {(() => {
                      // Use raw data to ensure we always get the "End of Program" scores regardless of visibility
                      const sourceData = selectedMember ? (activeTab === 'self' ? selectedMember.data.self : selectedMember.data.overall) : data.teamOverview;
                      const endDataset = sourceData.datasets.find(d => d.label === "End of Program") || sourceData.datasets[sourceData.datasets.length - 1];

                      if (!endDataset) return <p className="text-sm text-gray-400 italic">No data available.</p>;

                      // Combine labels and scores
                      const skills = sourceData.labels.map((label, i) => ({
                        label,
                        score: endDataset.data[i]
                      }));

                      // Sort descending by score
                      const topSkills = skills.sort((a, b) => b.score - a.score).slice(0, 3);

                      return topSkills.map((skill, i) => (
                        <div key={i}>
                          <div className="flex justify-between text-sm mb-1">
                            <span className="font-medium text-gray-700">{skill.label}</span>
                            <span className="font-bold text-purple-600">{skill.score.toFixed(2)}/5</span>
                          </div>
                          <div className="w-full bg-gray-100 rounded-full h-2.5">
                            <div className="bg-purple-600 h-2.5 rounded-full" style={{ width: `${(skill.score / 5) * 100}%` }}></div>
                          </div>
                        </div>
                      ));
                    })()}
                  </div>
                </div>

                <div className="bg-purple-900 text-white p-8 rounded-3xl shadow-xl relative overflow-hidden">
                  <div className="relative z-10">
                    <h3 className="font-bold text-xl mb-4">
                      {selectedMember ? "Key Insights" : "Key Insights"}
                    </h3>

                    {selectedMember ? (
                      <p className="text-purple-100 text-sm leading-relaxed italic">
                        {selectedMember.insight}
                      </p>
                    ) : (
                      <ul className="space-y-3 text-purple-100 text-base leading-relaxed">
                        {teamName === 'Money Migo' ? (
                          <>
                            <li className="flex gap-2">
                              <span className="bg-purple-500/50 rounded-full w-1.5 h-1.5 mt-1.5 shrink-0"></span>
                              <span><strong className="text-white font-semibold">Top Growth Areas:</strong> Collaboration & Communication (+1.65), Problem-Solving (+1.63), Adaptability & Creativity (+1.25).</span>
                            </li>
                            <li className="flex gap-2">
                              <span className="bg-purple-500/50 rounded-full w-1.5 h-1.5 mt-1.5 shrink-0"></span>
                              <span><strong className="text-white font-semibold">Focus Areas:</strong> Continued expansion of technical proficiency and ethical decision-making.</span>
                            </li>
                          </>
                        ) : teamName === 'Mobilize Us' ? (
                          <>
                            <li className="flex gap-2">
                              <span className="bg-purple-500/50 rounded-full w-1.5 h-1.5 mt-1.5 shrink-0"></span>
                              <span><strong className="text-white font-semibold">Top Growth Areas:</strong> Adaptability & Creativity (+0.93), Technical Aptitude (+0.75), Collaboration & Communication (+0.65).</span>
                            </li>
                            <li className="flex gap-2">
                              <span className="bg-purple-500/50 rounded-full w-1.5 h-1.5 mt-1.5 shrink-0"></span>
                              <span><strong className="text-white font-semibold">Focus Areas:</strong> Continued enhancement of analytical reasoning and time management.</span>
                            </li>
                          </>
                        ) : teamName === 'Willing Soil' ? (
                          <>
                            <li className="flex gap-2">
                              <span className="bg-purple-500/50 rounded-full w-1.5 h-1.5 mt-1.5 shrink-0"></span>
                              <span><strong className="text-white font-semibold">Top Growth Areas:</strong> Problem-Solving (+1.48), Collaboration & Communication (+1.40), Adaptability & Creativity (+1.20).</span>
                            </li>
                            <li className="flex gap-2">
                              <span className="bg-purple-500/50 rounded-full w-1.5 h-1.5 mt-1.5 shrink-0"></span>
                              <span><strong className="text-white font-semibold">Focus Areas:</strong> Continued development in Technical Aptitude and consistent time management under complex tasks.</span>
                            </li>
                          </>
                        ) : teamName === 'Endeavor' ? (
                          <>
                            <li className="flex gap-2">
                              <span className="bg-purple-500/50 rounded-full w-1.5 h-1.5 mt-1.5 shrink-0"></span>
                              <span><strong className="text-white font-semibold">Top Growth Areas:</strong> Collaboration & Communication (+1.37), Problem-Solving (+1.27), Adaptability & Creativity (+1.17).</span>
                            </li>
                            <li className="flex gap-2">
                              <span className="bg-purple-500/50 rounded-full w-1.5 h-1.5 mt-1.5 shrink-0"></span>
                              <span><strong className="text-white font-semibold">Focus Areas:</strong> Continued development in Technical Aptitude and Time Management.</span>
                            </li>
                          </>
                        ) : teamName === 'Semblynce' ? (
                          <>
                            <li className="flex gap-2">
                              <span className="bg-purple-500/50 rounded-full w-1.5 h-1.5 mt-1.5 shrink-0"></span>
                              <span><strong className="text-white font-semibold">Top Growth Areas:</strong> Problem-Solving (+1.17), Collaboration & Communication (+1.15), Adaptability & Creativity (+1.13).</span>
                            </li>
                            <li className="flex gap-2">
                              <span className="bg-purple-500/50 rounded-full w-1.5 h-1.5 mt-1.5 shrink-0"></span>
                              <span><strong className="text-white font-semibold">Focus Areas:</strong> Continued development in Technical Aptitude and Time Management, alongside sustained progress in Ethical & Emotional Intelligence.</span>
                            </li>
                          </>
                        ) : (
                          <>
                            <li className="flex gap-2">
                              <span className="bg-purple-500/50 rounded-full w-1.5 h-1.5 mt-1.5 shrink-0"></span>
                              <span><strong className="text-white font-semibold">Top Growth Areas:</strong> Adaptability & Creativity (+1.25), Collaboration & Communication (+1.25), Technical Aptitude (+1.38).</span>
                            </li>
                            <li className="flex gap-2">
                              <span className="bg-purple-500/50 rounded-full w-1.5 h-1.5 mt-1.5 shrink-0"></span>
                              <span><strong className="text-white font-semibold">Focus Areas:</strong> Problem-Solving and Time Management for continued development.</span>
                            </li>
                          </>
                        )}
                      </ul>
                    )}
                  </div>
                  <Hexagon className="absolute -bottom-10 -right-10 w-40 h-40 text-purple-800/50" />
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- Main App Component ---
    const App = () => {
      const [activeTeam, setActiveTeam] = useState(null);

      const handleTeamSelect = (team) => {
        setActiveTeam(team);
      };

      return (
        <div className="min-h-screen bg-[#FAFAFA] text-slate-900 font-sans selection:bg-purple-200 relative overflow-hidden">

          {/* Background Decorative Blobs */}
          <div className="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
            <div className="absolute top-[-10%] left-[-5%] w-[40rem] h-[40rem] bg-purple-200/30 rounded-full blur-3xl opacity-50 mix-blend-multiply filter animate-blob"></div>
            <div className="absolute top-[10%] right-[-10%] w-[35rem] h-[35rem] bg-blue-200/30 rounded-full blur-3xl opacity-50 mix-blend-multiply filter animate-blob animation-delay-2000"></div>
            <div className="absolute bottom-[-10%] left-[20%] w-[45rem] h-[45rem] bg-pink-100/30 rounded-full blur-3xl opacity-40 mix-blend-multiply filter animate-blob animation-delay-4000"></div>
          </div>

          <Header />

          <Navigation
            activeTeam={activeTeam}
            onTeamSelect={handleTeamSelect}
          />

          <main className="px-4 pb-20">
            {activeTeam === 'Thryfted' || activeTeam === 'Money Migo' || activeTeam === 'Mobilize Us' || activeTeam === 'Willing-Soil' || activeTeam === 'Endeavor' || activeTeam === 'Semblynce' ? (
              <TeamDashboard teamName={activeTeam} />
            ) : (
              <GuideCard />
            )}
          </main>

          <footer className="text-center pb-8 pt-4 border-t border-gray-200/50 mx-auto max-w-7xl">
            <p className="text-gray-400 text-sm font-medium">© Cambio Labs</p>
          </footer>
        </div>
      );
    };

    // --- Mount Application ---
    const rootElement = document.getElementById('root');
    if (!rootElement) {
      throw new Error("Could not find root element to mount to");
    }

    const root = createRoot(rootElement);
    root.render(
      <React.StrictMode>
        <App />
      </React.StrictMode>
    );
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
